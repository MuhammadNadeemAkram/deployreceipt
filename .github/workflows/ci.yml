name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      authorized_hostname:
        description: "Optional owner-authorized public staging test: www.noviqen.co.uk"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authorized-public-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.authorized_hostname == 'www.noviqen.co.uk'
    uses: ./.github/workflows/public-scanning-staging.yml
    with:
      authorized_hostname: ${{ inputs.authorized_hostname }}
    secrets:
      PUBLIC_SCAN_E2E_CHALLENGE: ${{ secrets.PUBLIC_SCAN_E2E_CHALLENGE }}
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run audit:security
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.122.0
      - run: supabase db start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
  fixture-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cp .env.worker.example .env.worker
      - run: docker compose -f compose.scan-local.yml up -d fixture
      - run: docker compose -f compose.scan-local.yml run --build --rm -e SCAN_EGRESS_TEST_ONLY=1 browser
      - if: always()
        run: docker compose -f compose.scan-local.yml down
  public-browser-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate disposable TLS fixture identity
        run: |
          mkdir -p work/gateway-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout work/gateway-certs/server.key -out work/gateway-certs/server.crt -subj '/CN=owned.qa-fixture.net' -addext 'subjectAltName=DNS:owned.qa-fixture.net' >/dev/null 2>&1
          chmod 644 work/gateway-certs/server.key
      - run: docker compose -f compose.scan-public-test.yml run --build --rm isolation-probe
      - run: docker compose -f compose.scan-public-test.yml run --build --rm gateway-transport
      - if: always()
        run: docker compose -f compose.scan-public-test.yml down
  reports-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # setup-cli v3 expects object metadata; npm 12 returns an array for multi-field view.
      - name: Install pinned Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase-cli" --no-package-lock --no-audit --no-fund supabase@2.122.0
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime > /tmp/deployreceipt-supabase-start.log 2>&1
      - run: node tests/integration/report-pipeline.mjs
        env:
          NODE_ENV: test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: controlled-report-e2e
          path: outputs/e2e-*
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: supabase stop --no-backup
