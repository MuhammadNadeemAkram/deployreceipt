project_id = "deployreceipt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/reset-password"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

[auth.rate_limit]
email_sent = 10
sms_sent = 0
sign_in_sign_ups = 20
token_refresh = 150
token_verifications = 20
anonymous_users = 0

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/scan_worker_access_token"
