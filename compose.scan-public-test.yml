# No external route. Attack probes run inside an isolated controlled network only.
services:
  isolation-probe:
    build:
      context: .
      dockerfile: worker/Dockerfile.public-browser
    environment:
      PUBLIC_ISOLATION_PROBE: "1"
    networks: [isolated_probe]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt:
      ["no-new-privileges:true", "seccomp=./worker/chromium-seccomp.json"]
    read_only: true
    tmpfs: ["/tmp:size=256m", "/home/pwuser:size=64m"]
    shm_size: 256m
    mem_limit: 768m
    cpus: 1
    pids_limit: 256
networks:
  isolated_probe:
    internal: true
